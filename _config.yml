# Site settings
title: "Vidya Sagar Reddy Venna"
description: "ML engineer working on biosignals, neural decoding, and time-series ML. MS ECE (ML & Data Science) at USC, May 2026."
tagline: "ML & Signal-Processing Engineer"
url: "https://visareve.github.io"
baseurl: ""

# Author info
author:
  name: "Vidya Sagar Reddy Venna"
  email: "vvenna@usc.edu"
  github: "ViSaReVe"
  linkedin: "vidyasagarvenna"
  scholar: "2zX94O4AAAAJ"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /posts/:title/
timezone: America/Los_Angeles

# Kramdown settings
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - BLOG-TEMPLATE.md
  - vendor/
  - .gitignore

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "page"
      image: "/assets/img/og-card.png"

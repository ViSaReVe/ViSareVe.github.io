  category: "LLM / RAG"
  description: "Local literature-review copilot — PDF on the left, chat on the right, every answer carrying (paper, page) citations and refusing when evidence is weak. Runs fully offline: no API keys, no GPU. Evaluated properly on 39 papers and 59 hand-reviewed questions with bootstrap CIs and paired McNemar tests, which showed the retrievers are statistically tied (TF-IDF vs hybrid, p = 1.000) and that LLM query-reformulation actively degraded results at 2x latency — built, measured, and left off by default."

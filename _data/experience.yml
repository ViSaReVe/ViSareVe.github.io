- role: "Graduate Researcher"
  organization: "USC Information Sciences Institute — Project Alexandria"
  logo: "/assets/img/logos/usc-isi.png"
  period: "Aug 2025 - Present"
  summary: "LLM pipeline turning research PDFs into a queryable knowledge graph."
  highlights:
    - "Built a PDF-to-structured-record service in Python (2,910 lines across 8 modules) with cloud and fully local model backends interchangeable behind one interface, cutting extraction cost per page to zero on the local path."
    - "Added semantic retrieval over ChromaDB with sentence-transformer embeddings, plus a Neo4j layer that resolves repeated entities across documents via MERGE on (name, type) — a cross-document node/edge graph instead of per-file silos."
    - "Built a four-family automated evaluation harness (information retention, n-gram overlap, LLM-as-judge, graph topology) instrumented with Weights & Biases, so every run emits reproducible quality signals."

- role: "Graduate Student Researcher"
  organization: "COOR Lab, USC — Clinical Biomechanics, Orthopedic and Sports Outcomes Research"
  logo: "/assets/img/logos/coor-usc.png"
  period: "Jul 2025 - Present"
  summary: "Clinical sEMG research on an NIH-funded rotator cuff trial."
  highlights:
    - "Engineered the Python signal-processing pipeline for multi-channel surface EMG: 2 kHz across 7 muscles and 54 patients — notch and Butterworth filtering, TKEO onset detection, MVIC normalization into a QC-gated dataset."
    - "Showed force and neuromuscular timing recover independently (r = -0.012, p = 0.938) with linear mixed-effects models under Bonferroni correction and leave-one-out cross-validated logistic regression."
    - "Result carried by two APTA CSM abstracts and a manuscript."

- role: "Machine Learning Intern"
